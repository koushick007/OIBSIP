<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Convert temperatures between Celsius, Fahrenheit, and Kelvin with real-time validation." />
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Temperature Converter</h1>
      <p class="app__subtitle">Convert between Celsius, Fahrenheit, and Kelvin</p>
    </header>

    <form id="converter-form" class="card" novalidate>
      <div class="field">
        <label for="temp-input" class="field__label">Temperature value</label>
        <input
          type="text"
          id="temp-input"
          name="temp-input"
          class="field__input"
          inputmode="decimal"
          autocomplete="off"
          placeholder="e.g. 25"
          aria-describedby="error-message"
        />
        <p id="error-message" class="field__error" role="alert" aria-live="assertive"></p>
      </div>

      <fieldset class="field field--units">
        <legend class="field__label">Input unit</legend>
        <div class="units" role="radiogroup" aria-label="Input unit">
          <label class="unit">
            <input type="radio" name="unit" value="celsius" checked />
            <span class="unit__box">Celsius (&deg;C)</span>
          </label>
          <label class="unit">
            <input type="radio" name="unit" value="fahrenheit" />
            <span class="unit__box">Fahrenheit (&deg;F)</span>
          </label>
          <label class="unit">
            <input type="radio" name="unit" value="kelvin" />
            <span class="unit__box">Kelvin (K)</span>
          </label>
        </div>
      </fieldset>

      <button type="submit" class="button">Convert</button>
    </form>

    <section id="results" class="results" aria-live="polite" hidden>
      <h2 class="results__title">Results</h2>
      <ul class="results__list">
        <li class="result" id="result-celsius">
          <span class="result__unit">Celsius</span>
          <span class="result__value" data-value>&mdash;</span>
        </li>
        <li class="result" id="result-fahrenheit">
          <span class="result__unit">Fahrenheit</span>
          <span class="result__value" data-value>&mdash;</span>
        </li>
        <li class="result" id="result-kelvin">
          <span class="result__unit">Kelvin</span>
          <span class="result__value" data-value>&mdash;</span>
        </li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
